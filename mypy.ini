# mypy.ini — конфиг для mypy (pyproject [tool.mypy] в версии 2.3.1 не
# полностью поддерживает disable_error_code — проверено 27.08.2026).
# Кэш/настройки: читает и pyproject.toml, и этот файл, но ошибки
# фасадной схемы отключаются только здесь (см. комментарий ниже).
[mypy]
python_version = 3.12
ignore_missing_imports = true
no_error_summary = true
# Фасадная схема проекта (core+ext+facade, канон FILE-SIZE.md):
# dual-mode imports (try: import пакетом / except: import напрямую) и
# re-export через globals().update() — mypy их не понимает и отдаёт
# шум (no-redef, attr-defined, name-defined, import-not-found).
# Это АРХИТЕКТУРА, не ошибки: коды отключены точечно, остальные
# правила (типы, аргументы) работают как есть.
allow_redefinition = true
disable_error_code = attr-defined, no-redef, name-defined, union-attr, import-not-found, var-annotated
