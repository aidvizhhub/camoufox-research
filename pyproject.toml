[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camoufox-research"
version = "0.19.0"
description = "MCP server for browser research on the anti-detect Camoufox browser: search, page reading (incl. JS/SPA), batch fetch, clicks, typing, sessions, cache"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "aidvizhhub"}]
requires-python = ">=3.10"
keywords = ["mcp", "camoufox", "browser", "research", "scraping", "agent", "deep-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Версии запинены по реально работающему окружению (проверено 08.2026) —
# без пинов pip дрейфует к новым версиям и ломает совместимость.
dependencies = [
    "mcp==2.1.1",  # v2 (2026-07-28): stateless, ttlMs/cacheScope, OTel по умолчанию
    "camoufox==0.5.5",
    "trafilatura>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# лёгкая установка без GPL-компонента (trafilatura GPL-3.0)
light = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
# разработка локально (то же, что гейты CI: ruff/mypy/bandit; pytest —
# удобство, канон проекта — unittest discover)
dev = ["ruff", "mypy", "bandit", "pytest>=8"]

[project.scripts]
camoufox-research = "camoufox_research.camoufox_research:main"

[project.urls]
Homepage = "https://github.com/aidvizhhub/camoufox-research"
Issues = "https://github.com/aidvizhhub/camoufox-research/issues"
Changelog = "https://github.com/aidvizhhub/camoufox-research/releases"

[tool.setuptools]
packages = ["camoufox_research"]

[tool.setuptools.package-data]
camoufox_research = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Канон: ловить РЕАЛЬНЫЕ ошибки, не наводить тень. RUF001-003
# (ambiguous unicode) выключены: русские докстринги — норма проекта.
# E501 оставлен (line-length 100 в [tool.ruff]), легаси-долг чистим
# постепенно.
select = ["E", "W", "F", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Фасадная схема проекта (канон FILE-SIZE.md): core+ext+facade.
# Фасады и ext-модули получают имена через globals().update(_core.__dict__)
# ИЛИ импортируют для re-export — статический анализ (ruff/mypy их не видит.
# F401 (импорт для re-export), F821/F822 (имена из globals-обновления) —
# легитимны по архитектуре, НЕ по небрежности: игноры документированы.
"camoufox_research/camoufox_worker.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_worker_core.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_worker_core_a.py" = ["F401"]
"camoufox_research/camoufox_worker_ext.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_worker_core_b.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_fetch.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_fetch_ext.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_fetch_core.py" = ["F401"]
"camoufox_research/camoufox_campaign.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_campaign_ext.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_session.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_session_core.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_session_core_a.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_browser.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_crawl.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_sources.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_digest.py" = ["F401", "F821", "F822"]
"camoufox_research/camoufox_digest_core.py" = ["F401"]

[tool.mypy]
# Полная конфигурация mypy — в mypy.ini (pyproject [tool.mypy] в mypy
# 2.3.1 не поддерживает disable_error_code для фасадной схемы).
ignore_missing_imports = true
no_error_summary = true

[tool.bandit]
exclude_dirs = ["tests"]
