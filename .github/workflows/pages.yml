name: pages

# Витрина добычи: research/ → статический сайт на GitHub Pages.
# Настройка В ОДИН КЛИК: Settings → Pages → Source = "GitHub Actions".
# Сборка: scripts/build_pages.py (stdlib-only, без Jekyll/зависимостей).

on:
  push:
    branches: [main, master]
    paths: ["research/**", "scripts/build_pages.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Собрать витрину (research/public/ → _site/)
        run: |
          pip install . 2>&1 | tail -n 2
          python scripts/build_pages.py --src research/public --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
