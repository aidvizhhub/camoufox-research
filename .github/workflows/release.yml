name: release

# Публикация на PyPI через Trusted Publishing (OIDC, БЕЗ токенов в
# секретах — индустрия-канон 2026). Пока юзер не привяжет проект на
# pypi.org, джоб честно SKIP (vars.PYPI_PUBLISH != yes) — CI зелёный.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "bump версии перед релизом (patch/minor/major/пусто=нет)"
        required: false
        default: ""
        type: string

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bump и закоммитить
        run: |
          python scripts/bump_version.py --part "${{ github.event.inputs.bump }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml camoufox_research/camoufox_research.py README.md
          git commit -m "chore: bump $(grep -oP '^version = \"\K[^\"]+' pyproject.toml)"
          git push

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'yes'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.API_TOKEN_PYPI != '' }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      # Публикация в два эшелона: главный — Trusted Publishing (OIDC,
      # БЕЗ токенов); привязка на pypi.org (5 полей): owner aidvizhhub ·
      # repo camoufox-research · workflow release.yml · environment pypi ·
      # project name camoufox-research. Пока форма не совпала —
      # страховочный токен API_TOKEN_PYPI публикует сам (если секрет жив).
      - name: publish (OIDC)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: publish (token fallback)
        if: steps.oidc.outcome != 'success' && env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.API_TOKEN_PYPI }}
      # Честный гейт: если ни OIDC, ни токен не опубликовали — релиз
      # КРАСНЫЙ (раньше continue-on-error рисовал «✓» без пакета на PyPI,
      # урок 27.08.2026: v0.18.1 «успешен» на бумаге, пакета нет).
      - name: fail if not published
        if: steps.oidc.outcome != 'success' && env.HAS_TOKEN != 'true'
        run: |
          echo "::error::Обе публикации не удались: OIDC invalid-publisher + секрет API_TOKEN_PYPI отсутствует."
          echo "Фикс: 1) привязать publisher на pypi.org (owner aidvizhhub · repo camoufox-research · workflow release.yml · environment pypi · project camoufox-research) или 2) вернуть секрет API_TOKEN_PYPI. Потом: gh run rerun <run-id> или workflow_dispatch."
          exit 1
