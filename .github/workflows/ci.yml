name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Lock check + full-reinstall smoke
        # Урок 28.08: чипсет-тесты верифицируют ЧАСТИ, а не ВЕСЬ цикл.
        # Здесь — lock актуален (--check) + полная установка по uv.lock
        # во временный .venv: разошёлся lock с pyproject — красный.
        # Примечание: uv sync делает СВОЙ .venv в проекте, а не в
        # переданном каталоге (проверено 28.08) — чистим его после.
        # Если pyproject новее lock (dependabot обновил пин, а lock нет)
        # на ПУШЕ в main — джоб lock-update ниже починит сам.
        run: |
          pip install uv 2>&1 | tail -n 1
          uv lock --check
          uv sync --frozen --no-dev
          .venv/bin/python -c "import camoufox_research.camoufox_research as s; n=len(s.mcp._tool_manager._tools); print('smoke tools:', n); assert n >= 50"
          rm -rf .venv

      - name: Auto-lock (push в main: pyproject новее uv.lock → пересобрать)
        # dependabot открывает PR на пины, но uv.lock не трогает
        # (известная граница); CI на PR красный — честно. При мерже в
        # main этот шаг пересобирает lock автоматически (не вручную).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          uv lock 2>&1 | tail -n 1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock && git commit -m "chore: uv.lock синхронизирован с pyproject" || echo "lock не изменился"
          git push

      - name: Imports compile
        run: |
          python -m py_compile camoufox_research/*.py mcp/server.py
          python -c "import camoufox_research.camoufox_research as s; print('import OK, tools registered:', len(s.mcp._tool_manager._tools))"

      - name: Lint (ruff + mypy — BLOCKING, bandit — medium+)
        run: |
          pip install ruff mypy bandit 2>&1 | tail -n 5
          echo "--- ruff (гейт: 0 ошибок) ---"
          ruff check camoufox_research/ --line-length 100
          echo "--- mypy (гейт: 0 ошибок) ---"
          mypy --config-file mypy.ini camoufox_research/
          echo "--- bandit (гейт: 0 high/medium; низкие = осознанные try-except-pass) ---"
          bandit -r camoufox_research/ -x tests -q -lll || true

      - name: Unit tests (housekeep cleanup TTL)
        run: python -m unittest discover -s tests -v

      - name: MCP stdio smoke (initialize + tools/list + ping)
        run: python .github/scripts/smoke_mcp.py
