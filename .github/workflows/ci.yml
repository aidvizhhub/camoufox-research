name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Imports compile
        run: |
          python -m py_compile camoufox_research/*.py mcp/server.py
          python -c "import camoufox_research.camoufox_research as s; print('import OK, server:', s.FastMCP and 'ok')"

      - name: MCP stdio smoke (initialize + tools/list + ping)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ping","arguments":{}}}' \
            | timeout 60 camoufox-research 2>/dev/null \
            | python -c "
import sys, json
seen = set()
for line in sys.stdin:
    try: d = json.loads(line)
    except Exception: continue
    if d.get('id') == 1: seen.add('init')
    if d.get('id') == 2 and 'tools' in d.get('result', {}):
        names = [t['name'] for t in d['result']['tools']]
        assert 'web_search' in names and 'session_start' in names, names
        assert len(names) >= 20, names
        seen.add('tools:' + str(len(names)))
    if d.get('id') == 3:
        txt = ''.join(c.get('text','') for c in d['result']['content'])
        assert 'pong' in txt, txt
        seen.add('ping')
print('smoke OK ->', seen)
"
