name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Imports compile
        run: |
          python -m py_compile camoufox_research/*.py mcp/server.py
          python -c "import camoufox_research.camoufox_research as s; print('import OK, tools registered:', len(s.mcp._tool_manager._tools))"

      - name: Lint (ruff, mypy, bandit) — non-blocking
        run: |
          pip install ruff mypy bandit 2>&1 | tail -n 5
          echo "--- ruff ---"
          ruff check camoufox_research/ --line-length 100 || true
          echo "--- mypy ---"
          mypy camoufox_research/ --ignore-missing-imports --no-error-summary || true
          echo "--- bandit ---"
          bandit -r camoufox_research/ -x tests -q || true

      - name: Unit tests (housekeep cleanup TTL)
        run: python -m unittest discover -s tests -v

      - name: MCP stdio smoke (initialize + tools/list + ping)
        run: python .github/scripts/smoke_mcp.py
